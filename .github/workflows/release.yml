name: prepare-reviewed-release

on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Full reviewed commit SHA (no branch or tag)
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '3'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  artifacts:
    # Configure required reviewers for this environment in repository settings.
    # This workflow has no publication credentials and never uploads to crates.io
    # or creates a GitHub release/tag. Approval covers artifact preparation only.
    environment: release-review
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Require immutable revision
        shell: bash
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: test "${#REVIEWED_SHA}" = 40 && [[ "$REVIEWED_SHA" =~ ^[0-9a-f]+$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.reviewed_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: clippy, rustfmt
      - name: Assert reviewed revision and native target
        shell: bash
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
          test "$(rustc -Vv | sed -n 's/^host: //p')" = '${{ matrix.target }}'
      - name: Install pinned dependency notice generator
        run: cargo install --locked --version 0.9.2 --features cli cargo-about
      - name: Scan reviewed source history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Prepare clean candidate artifacts
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/rustyred-release-target
        run: scripts/release-check --output '${{ runner.temp }}/rustyred-release'
      - uses: actions/upload-artifact@v4
        with:
          name: rustyred-review-${{ matrix.target }}-${{ inputs.reviewed_sha }}
          path: |
            ${{ runner.temp }}/rustyred-release/rustyred
            ${{ runner.temp }}/rustyred-release/*.tar.gz
            ${{ runner.temp }}/rustyred-release/crates/*.crate
            ${{ runner.temp }}/rustyred-release/SHA256SUMS
            ${{ runner.temp }}/rustyred-release/provenance.json
            ${{ runner.temp }}/rustyred-release/THIRD_PARTY_LICENSES.html
            ${{ runner.temp }}/rustyred-release/package-evidence/evidence.json
            ${{ runner.temp }}/rustyred-release/package-evidence/consumer-tree.txt
