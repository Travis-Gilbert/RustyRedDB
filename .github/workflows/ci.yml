name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '3'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_TEST_OPT_LEVEL: '1'
  # Several retained structural oracles read process-wide work counters.
  # Keep their assertions isolated from other tests in the same binary.
  RUST_TEST_THREADS: '1'

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: clippy, rustfmt
      - name: Assert native target and compiler floor
        shell: bash
        run: |
          rustc -Vv
          test "$(rustc -Vv | sed -n 's/^host: //p')" = '${{ matrix.target }}'
      - name: Public dependency boundary
        run: |
          python3 scripts/test_dependency_boundary.py
          python3 scripts/dependency_boundary.py
      - name: Formatting for changed first-party Rust files
        env:
          FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/check-format --base "$FORMAT_BASE"
      - name: Embedded facade, CLI, example and failure oracles
        run: cargo test --locked -p rustyred -p rustyred-cli -p parts-catalog --features rustyred/test-fault-injection
      - name: Engine unit suite (calibrated latency profile)
        run: cargo test --locked --no-fail-fast -p rustyred-engine --lib --features test-fault-injection
      - name: Complete engine integration target set (calibrated scaling profile)
        run: cargo test --locked --no-fail-fast -p rustyred-engine --profile dev --test '*' --features test-fault-injection
      - name: Query suites
        run: cargo test --locked --no-fail-fast -p rustyred-query
      - name: Known committed fold-maintenance failure oracle
        run: cargo test --locked --no-fail-fast -p rustyred-engine --profile dev --features test-fault-injection --test fold_commit_outcome
      - name: Supporting crate suites
        env:
          TS_RS_EXPORT_DIR: ${{ runner.temp }}/generated-bindings
        run: cargo test --locked -p rustyred-log -p rustyred-bayes -p rustyred-contracts -p rustyred-scope -p rustyred-datalog -p rustyred-egraph -p rustyred-derivation -p rustyred-query-saturate
      - name: Physical log subprocess crash and mixed-version recovery
        env:
          THEOREM_RUN_CRASH_MATRIX: '1'
        run: cargo test --locked -p rustyred-log --test crash_reopen crash_matrix -- --ignored
      - name: Documentation tests and examples
        run: cargo test --locked --doc -p rustyred -p rustyred-engine -p rustyred-query -p rustyred-log -p rustyred-derivation
      - name: Clippy (default supported native closure)
        run: cargo clippy --locked -p rustyred -p rustyred-cli -p rustyred-engine -p rustyred-query --all-targets
      - name: Optional pure Rust feature matrix
        shell: bash
        run: |
          cargo check --locked -p rustyred-engine --lib --no-default-features
          for feature in fjall-floor redis-store tantivy s2; do
            cargo check --locked -p rustyred-engine --lib --features "$feature"
          done
      - name: Normalized package and outside-workspace consumer
        run: python3 scripts/package_rehearsal.py --output '${{ runner.temp }}/rustyred-package-evidence'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-evidence-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/rustyred-package-evidence/evidence.json
            ${{ runner.temp }}/rustyred-package-evidence/archive-targets-checked.json
            ${{ runner.temp }}/rustyred-package-evidence/consumer-tree.txt
            ${{ runner.temp }}/rustyred-package-evidence/archives/*.crate

  clean-candidate-measurement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.96.1
      - name: Install isolated measurement dependency
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/measurement-venv"
          "$RUNNER_TEMP/measurement-venv/bin/pip" install psutil==7.2.2
      - name: Cold clean-pinned build and real example measurements
        shell: bash
        run: |
          "$RUNNER_TEMP/measurement-venv/bin/python" scripts/measure_release.py \
            --target-dir "$RUNNER_TEMP/measurement-target" \
            --output "$RUNNER_TEMP/measurement-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clean-candidate-measurement-x86_64-unknown-linux-gnu
          path: |
            ${{ runner.temp }}/measurement-evidence/measurements.json
            ${{ runner.temp }}/measurement-evidence/build.log
