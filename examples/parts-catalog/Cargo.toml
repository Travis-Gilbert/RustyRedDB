[package]
include = ["Cargo.toml", "src/**", "tests/**", "fixtures/**", "benches/**", "examples/**", "build.rs", "README*", "LICENSE*", "NOTICE.md"]
rust-version = "1.96.1"
name = "parts-catalog"
version = "0.1.0-beta.2"
edition = "2021"
license = "MIT"
publish = false
description = "A small parts-and-suppliers database on Rusty Red."

[[bin]]
name = "parts-catalog"
path = "src/main.rs"

[dependencies]
rustyred = { version = "=0.1.0-beta.2", path = "../../crates/rustyred" }
serde_json = "1.0"
