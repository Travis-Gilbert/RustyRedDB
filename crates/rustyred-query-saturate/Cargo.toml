[package]
rust-version = "1.96.1"
include = ["src/**", "tests/**", "golden/**", "benches/**", "build.rs", "README*", "LICENSE*", "NOTICE.md"]
name = "rustyred-query-saturate"
version = "0.1.0-beta.2"
edition = "2021"
description = "Proof-carrying equality saturation for RustyRed query plans."
license = "MIT"
repository = "https://github.com/Travis-Gilbert/RustyRedDB"

[features]
default = []

[dependencies]
egg = { package = "rustyred-egg", version = "=0.1.0-beta.2", path = "../../vendor/egg-0.10.0" }
rustyred-thg-core = { package = "rustyred-engine", version = "=0.1.0-beta.2", path = "../rustyred-engine" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

pest = "2.7"
pest_derive = "2.7"
sqlparser = "0.62"

[dev-dependencies]
proptest = "1"

[lib]
name = "rustyred_thg_query_saturate"
