[package]
include = ["Cargo.toml", "src/**", "tests/**", "fixtures/**", "benches/**", "examples/**", "build.rs", "README*", "LICENSE*", "NOTICE.md"]
rust-version = "1.96.1"
name = "rustyred-datalog"
version = "0.1.0-beta.2"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Theorem Datalog engines: compiled datafrog rules and runtime egglog relations with one derivation receipt"
repository = "https://github.com/Travis-Gilbert/RustyRedDB"
readme = "README.md"

[lib]
name = "datalog"

[dependencies]
datafrog = "=2.0.1"
egraph = { package = "rustyred-egraph", version = "=0.1.0-beta.2", path = "../rustyred-egraph" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
