[package]
name = "rustyred-contracts"
version = "0.1.0-beta.1"
edition = "2021"
license = "MIT"
rust-version = "1.85"
description = "Database, sync, storage, and link contracts for Rusty Red."
repository = "https://github.com/Travis-Gilbert/RustyRedDB"

[lib]
name = "theorem_surface_contracts"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12.0.1", features = ["serde-compat", "serde-json-impl"] }
