[package]
name = "rustyred-cli"
version = "0.1.0-beta.1"
edition = "2021"
license = "MIT"
rust-version = "1.89"
description = "Local Rusty Red commands: create, query, inspect, and verify."
repository = "https://github.com/Travis-Gilbert/RustyRedDB"

[[bin]]
name = "rustyred"
path = "src/main.rs"

[dependencies]
rustyred = { version = "=0.1.0-beta.1", path = "../rustyred" }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"
