[package]
include = ["Cargo.toml", "src/**", "tests/**", "fixtures/**", "benches/**", "examples/**", "build.rs", "README*", "LICENSE*", "NOTICE.md"]
name = "rustyred-egraph"
version = "0.1.0-beta.2"
edition = "2021"
rust-version = "1.96.1"
description = "Pure egglog-backed equality saturation, extraction, and relational evaluation for Theorem."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Travis-Gilbert/RustyRedDB"
readme = "README.md"
keywords = ["egraph", "egglog", "datalog", "provenance"]
categories = ["algorithms", "compilers"]

[lib]
name = "egraph"
path = "src/lib.rs"

[dependencies]
egglog = { version = "=2.0.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2.0"

# egglog-add-primitive2.0.0 parses full expressions but omits this host feature.
[build-dependencies]
syn = { version = "2.0", features = ["full"] }
