[package]
name = "rustyred-bayes"
version = "0.1.0-beta.1"
edition = "2021"
description = "Small Bayesian posterior values and deterministic receipt/draw helpers for Theorem harness decision gates."
license = "MIT"
repository = "https://github.com/Travis-Gilbert/RustyRedDB"
readme = "README.md"
rust-version = "1.85"


[lib]
name = "theorem_bayes"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
