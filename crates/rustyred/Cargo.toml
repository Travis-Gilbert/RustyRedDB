[package]
name = "rustyred"
version = "0.1.0-beta.1"
edition = "2021"
license = "MIT"
rust-version = "1.89"
description = "Embedded Rusty Red database: create, query, mutate, and verify a native .RR graph."
repository = "https://github.com/Travis-Gilbert/RustyRedDB"
readme = "../../README.md"

[dependencies]
rustyred-contracts = { version = "=0.1.0-beta.1", path = "../rustyred-contracts" }
rustyred-engine = { version = "=0.1.0-beta.1", path = "../rustyred-engine" }
rustyred-query = { version = "=0.1.0-beta.1", path = "../rustyred-query" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }

[dev-dependencies]
tempfile = "3"
sha2 = "0.10"

[[test]]
name = "rr_roundtrip"
harness = false
