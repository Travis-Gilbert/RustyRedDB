[package]
name = "rustyred-query"
version = "0.1.0-beta.1"
edition = "2021"
description = "Shared OpenCypher parser, read-gate, executor, and query receipts for Theorem MCP and HTTP query surfaces."
license = "MIT"
repository = "https://github.com/Travis-Gilbert/RustyRedDB"
rust-version = "1.85"


[lib]
name = "rustyred_thg_query"

[dependencies]
pest = "2.7"
pest_derive = "2.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
rustyred-thg-core = { package = "rustyred-engine", version = "=0.1.0-beta.1", path = "../rustyred-engine" }
