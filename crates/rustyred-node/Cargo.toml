[package]
name = "rustyred-node"
version = "0.1.0-beta.2"
edition = "2021"
license = "MIT"
rust-version = "1.96.1"
description = "Node-API binding for embedded Rusty Red, for Node.js and Bun."
repository = "https://github.com/Travis-Gilbert/RustyRedDB"
# Shipped as an npm package built by @napi-rs/cli, not as a crate.
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.15.0", default-features = false, features = ["napi8", "serde-json"] }
napi-derive = "3.6.13"
rustyred = { path = "../rustyred", features = ["fulltext"] }
serde_json = "1.0"

[build-dependencies]
napi-build = "2.6.0"
