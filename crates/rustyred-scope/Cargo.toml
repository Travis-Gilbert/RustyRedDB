[package]
include = ["Cargo.toml", "src/**", "tests/**", "fixtures/**", "benches/**", "examples/**", "build.rs", "README*", "LICENSE*", "NOTICE.md"]
name = "rustyred-scope"
version = "0.1.0-beta.2"
edition = "2021"
description = "The capability-scope charter shared by the affordance substrate and the surface contracts: one allowlist intersection, no graph dependency."
license = "MIT"
repository = "https://github.com/Travis-Gilbert/RustyRedDB"
readme = "README.md"
rust-version = "1.96.1"


[lib]
name = "theorem_capability_scope"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
